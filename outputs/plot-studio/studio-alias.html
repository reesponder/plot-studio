<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#191c1d">
    <meta name="robots" content="noindex">
    <title>PLOT Studio</title>
    <link rel="stylesheet" href="/xaxxaxaxaxa.css">
    <script type="module" src="/xaxxaxaxaxa.mjs"></script>
  </head>
  <body>
    <main id="studio-access" aria-labelledby="studio-title">
      <p class="wordmark">PLOT<span>.</span></p>
      <h1 id="studio-title">Studio</h1>
      <p id="studio-status" role="status">Checking your session…</p>
      <noscript><p>Enable JavaScript to open the editor.</p></noscript>
      <nav aria-label="Studio access">
        <a class="sign-in" href="https://plotstudio.pro/sign-in" target="_top">Sign in</a>
        <a class="retry" href="/studio/" target="_top" hidden>Try again</a>
      </nav>
    </main>
    <iframe
      id="studio-frame"
      title="PLOT Studio editor"
      allow="clipboard-write https://plotstudio.pro; clipboard-read https://plotstudio.pro"
      referrerpolicy="origin"
      hidden
    ></iframe>
  </body>
</html>
